server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: como o go_router usa URLs reais (deep links), qualquer rota
    # desconhecida deve cair no index.html (e não em 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Não cachear o index nem o service worker, para pegar novos deploys.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Compressão (o main.dart.js / canvaskit são grandes).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/wasm;
}
