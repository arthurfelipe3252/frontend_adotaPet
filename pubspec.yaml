name: adota_pet
description: "Plataforma de adoção responsável de pets"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  provider: ^6.1.5
  go_router: ^14.6.1
  mask_text_input_formatter: ^2.9.0
  brasil_fields: ^1.19.0
  file_picker: ^8.0.0
  shared_preferences: ^2.5.5
  jwt_decoder: ^2.0.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  excel: ^4.0.6
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Ícone do app (AdotaPet) — gerado a partir de assets/icon/.
# Rodar após mudar a imagem: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#D2693A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"